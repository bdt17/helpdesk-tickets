# SQLite. Versions 3.8.0 and up are supported.
default: &default
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  adapter: sqlite3
  database: storage/development.sqlite3

test:
  <<: *default
  adapter: sqlite3
  database: storage/test.sqlite3

production:
  <<: *default
  adapter: postgresql
  url: <%= ENV['DATABASE_URL'] %>
  # Background jobs run as threads in the web process (see config/puma.rb),
  # sharing this pool with Puma's request threads: 3 worker threads plus
  # the dispatcher, scheduler and heartbeat threads need connections too.
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 }.to_i + 10 %>
