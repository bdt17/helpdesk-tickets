# SQLite. Versions 3.8.0 and up are supported.
default: &default
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    adapter: sqlite3
    database: storage/development.sqlite3
  queue:
    <<: *default
    adapter: sqlite3
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate

test:
  primary:
    <<: *default
    adapter: sqlite3
    database: storage/test.sqlite3
  queue:
    <<: *default
    adapter: sqlite3
    database: storage/test_queue.sqlite3
    migrations_paths: db/queue_migrate

production:
  primary: &primary_production
    <<: *default
    adapter: postgresql
    url: <%= ENV['DATABASE_URL'] %>
  # Solid Queue's tables live in the same Postgres database as the app
  # (there's only one DATABASE_URL provisioned) rather than a genuinely
  # separate database - still a distinct connection/schema-load role from
  # Rails' point of view, just not physically isolated infrastructure.
  queue:
    <<: *primary_production
    migrations_paths: db/queue_migrate
