name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare databases
        run: |
          bin/rails db:prepare
          RAILS_ENV=test bin/rails db:prepare

      - name: Run CI
        run: bin/ci
